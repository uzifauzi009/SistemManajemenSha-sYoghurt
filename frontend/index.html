<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7f4">
    <meta name="description" content="Dashboard manajemen SHA'S YOGHURT">
    <title>Dashboard | SHA'S YOGHURT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" aria-label="Navigasi utama">
            <a class="brand" href="#" data-page="home" aria-label="SHA'S YOGHURT, beranda">
                <span class="brand-mark" aria-hidden="true">s</span>
                <span class="brand-copy"><strong>sha's yoghurt</strong><small>ADMINISTRATOR</small></span>
            </a>

            <div class="sidebar-label">MENU UTAMA</div>
            <nav class="side-nav">
                <button class="nav-link is-active" type="button" data-page="home"><span class="nav-icon" aria-hidden="true">⌂</span>Dashboard</button>
                <button class="nav-link" type="button" data-page="mitra"><span class="nav-icon" aria-hidden="true">♧</span>Mitra</button>
                <button class="nav-link" type="button" data-page="penjualan"><span class="nav-icon" aria-hidden="true">↗</span>Penjualan</button>
                <button class="nav-link" type="button" data-page="tagihan"><span class="nav-icon" aria-hidden="true">▤</span>Tagihan <span class="nav-count">7</span></button>
                <button class="nav-link" type="button" data-page="distribusi"><span class="nav-icon" aria-hidden="true">⇢</span>Distribusi</button>
                <button class="nav-link" type="button" data-page="produk"><span class="nav-icon" aria-hidden="true">▦</span>Produk</button>
            </nav>

            <div class="sidebar-bottom">
                <div class="help-card">
                    <span class="help-icon" aria-hidden="true">✦</span>
                    <strong>Butuh bantuan?</strong>
                    <p>Hubungi tim dukungan jika Anda mengalami kendala.</p>
                    <a href="mailto:dukungan@shasyoghurt.id">Hubungi kami <span aria-hidden="true">→</span></a>
                </div>
                <button class="profile-button" type="button" data-page="profil">
                    <span class="avatar">AR</span>
                    <span class="profile-copy"><strong>Rina Amelia</strong><small>Administrator</small></span>
                    <span class="profile-more" aria-hidden="true">•••</span>
                </button>
            </div>
        </aside>

        <div class="main-column">
            <header class="topbar">
                <div class="breadcrumb"><span>SHA'S YOGHURT</span><span class="breadcrumb-separator">/</span><strong id="breadcrumb-current">Dashboard</strong></div>
                <div class="topbar-actions">
                    <span class="today-date" id="today-date"></span>
                    <button class="icon-button notification-button" type="button" aria-label="Notifikasi">
                        <span aria-hidden="true">♧</span><i></i>
                    </button>
                    <button class="topbar-profile" type="button" data-page="profil"><span class="avatar avatar-small">AR</span><span>Rina Amelia</span><span class="chevron" aria-hidden="true">⌄</span></button>
                </div>
            </header>

            <main id="main-content" class="page-content" tabindex="-1"></main>
        </div>
    </div>

    <nav class="mobile-nav" aria-label="Navigasi bawah">
        <button class="mobile-nav-link is-active" type="button" data-page="home"><span aria-hidden="true">⌂</span><small>Beranda</small></button>
        <button class="mobile-nav-link" type="button" data-page="mitra"><span aria-hidden="true">♧</span><small>Mitra</small></button>
        <button class="mobile-nav-link" type="button" data-page="tagihan"><span aria-hidden="true">▤</span><small>Tagihan</small></button>
        <button class="mobile-nav-link" type="button" data-page="distribusi"><span aria-hidden="true">⇢</span><small>Kirim</small></button>
        <button class="mobile-nav-link" type="button" data-page="produk"><span aria-hidden="true">▦</span><small>Produk</small></button>
    </nav>

    <dialog class="app-dialog" id="action-dialog" aria-labelledby="dialog-title">
        <form id="action-form" method="dialog">
            <div class="dialog-heading">
                <div><p class="eyebrow">SHA'S YOGHURT</p><h2 id="dialog-title"></h2></div>
                <button class="icon-button dialog-close" type="button" aria-label="Tutup">×</button>
            </div>
            <div id="dialog-fields" class="dialog-fields"></div>
            <div class="dialog-actions">
                <button class="button button-quiet" type="button" data-close-dialog>Batal</button>
                <button class="button button-primary" type="submit" id="dialog-submit">Simpan data</button>
            </div>
        </form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
