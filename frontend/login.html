<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHA'S YOGHURT - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0284c7;
            --bg-body: #f1f5f9;
            --white: #ffffff;
            --text-dark: #0f172a;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-dark); }
        .app-container { max-width: 480px; margin: 40px auto; background: var(--white); min-height: 800px; border-radius: 40px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); padding: 20px; position: relative; overflow: hidden; }
        
        .header-section { background: linear-gradient(135deg, var(--primary-blue), #38bdf8); color: white; padding: 30px 20px; border-radius: 30px; margin: -20px -20px 20px -20px; }
        
        .card { border: none; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        .nav-bottom { position: absolute; bottom: 0; left: 0; right: 0; background: white; padding: 15px; display: flex; justify-content: space-around; border-top: 1px solid #e2e8f0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 12px; color: #64748b; font-weight: 600; }
        
        .btn-primary-custom { background: var(--primary-blue); color: white; border-radius: 15px; padding: 15px; font-weight: 700; width: 100%; border: none; }
        
        .input-group-custom { margin-bottom: 15px; }
        .input-group-custom label { font-size: 13px; font-weight: 600; margin-bottom: 5px; display: block; }
        .input-group-custom input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header-section">
            <h2 class="fw-bold">Selamat Datang</h2>
            <p class="mb-0 small">Masuk untuk mengelola mitra, tagihan, dan distribusi.</p>
        </div>

        <!-- Form Login -->
        <div class="input-group-custom">
            <label>Username</label>
            <input type="text" placeholder="admin01">
        </div>
        <div class="input-group-custom">
            <label>Password</label>
            <input type="password" placeholder="••••••••">
        </div>
        
        <button class="btn-primary-custom mt-3">Masuk</button>
        <p class="text-center mt-3 small text-muted">Hanya untuk Admin terdaftar</p>
    </div>

</body>
</html>
